<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>Puregold | Dashboard</title>

    <link
      href="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/style.min.css"
      rel="stylesheet"
    />
    <link href="css/styles.css" rel="stylesheet" />
    <link href="css/dashboard.css" rel="stylesheet" />
    <script
      src="https://use.fontawesome.com/releases/v6.3.0/js/all.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <div id="layoutSidenav">
      <!-- Side Navigation -->
      <div class="dash_card side-nav-card">
        <nav class="sb-sidenav" id="sidenavAccordion">
          <div class="sidebar-header">
            <img
              src="assets/img/logo.png"
              height="100px"
              width="100px"
              alt="Logo"
            />
            <div id="user_logged" class="user-info"></div>
          </div>
          <div class="sb-sidenav-menu">
            <a class="nav-link active" href="dashboard.html">
              <i class="fa-solid fa-table-columns"></i> Dashboard
            </a>
            <div id="nav_admin_pages"></div>
            <a class="nav-link" href="inventory.html">
              <i class="fa-solid fa-warehouse"></i> Inventory
            </a>
            <a class="nav-link" href="sales.html">
              <i class="fa-solid fa-clock-rotate-left"></i> Sales
            </a>
            <a class="nav-link" href="purchase.html">
              <i class="fa-solid fa-shop"></i> Purchase
            </a>
            <!-- <a class="nav-link" href="customer.html">
              <i class="fa-solid fa-person"></i> Customer Point System
            </a> -->
            <button id="btn_logout" class="logout">
              <i class="fa-solid fa-sign-out-alt"></i> Logout
            </button>
          </div>
        </nav>
      </div>

      <!-- Main Content -->
      <div id="layoutSidenav_content">
        <main>
          <div class="container-fluid px-4">
            <div class="row sticky-header">
              <div class="col-12 col-md-6">
                <h5 id="currentTimestamp" class="timestamp"></h5>
              </div>
            </div>
            <!-- Purchase Modal -->
            <div
              class="modal fade"
              id="purchaseModal"
              tabindex="-1"
              aria-labelledby="purchaseModalLabel"
              aria-hidden="true"
            >
              <div class="modal-dialog">
                <div class="modal-content">
                  <div class="modal-header">
                    <h5 class="modal-title" id="purchaseModalLabel">
                      Purchase Product
                    </h5>
                    <button
                      type="button"
                      class="btn-close"
                      data-bs-dismiss="modal"
                      aria-label="Close"
                    ></button>
                  </div>
                  <div class="modal-body">
                    <form id="purchaseForm">
                      <div class="mb-3">
                        <label for="productName" class="form-label"
                          >Product Name</label
                        >
                        <input
                          type="text"
                          class="form-control"
                          id="productName"
                          readonly
                        />
                      </div>
                      <div class="mb-3">
                        <label for="productQuantity" class="form-label"
                          >Quantity</label
                        >
                        <input
                          type="number"
                          class="form-control"
                          id="productQuantity"
                          min="1"
                          required
                        />
                      </div>
                      <div class="mb-3">
                        <label for="unitPrice" class="form-label"
                          >Unit Price</label
                        >
                        <input
                          type="text"
                          class="form-control"
                          id="unitPrice"
                          readonly
                        />
                      </div>
                      <!-- <div class="mb-3">
                        <label for="paymentMethod" class="form-label"
                          >Payment Method</label
                        >
                        <input
                          type="text"
                          class="form-control"
                          id="paymentMethod"
                        />
                      </div> -->
                      <!-- Hidden Field for store_id -->
                      <input type="hidden" id="storeId" />

                      <!-- Vendor ID input filled by user -->
                      <div class="mb-3">
                        <label for="vendorId" class="form-label"
                          >Vendor ID</label
                        >
                        <input
                          type="text"
                          class="form-control"
                          id="vendorId"
                          required
                        />
                      </div>
                    </form>
                  </div>
                  <div class="modal-footer">
                    <button
                      type="button"
                      class="btn btn-secondary"
                      data-bs-dismiss="modal"
                    >
                      Close
                    </button>
                    <button
                      type="button"
                      class="btn btn-primary"
                      id="submitOrderBtn"
                    >
                      Submit Order
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <div class="row mt-5">
              <div class="col-md-12">
                <div class="card summary-card">
                  <div class="card-body">
                    <!-- Store Table -->
                    <table class="table table-bordered">
                      <thead>
                        <tr>
                          <th>Store Address</th>
                          <th>Product</th>
                          <th>Quantity</th>
                          <th>Action</th>
                        </tr>
                      </thead>
                      <tbody id="storeProductTable">
                        <!-- Dynamic rows will be added here -->
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/js/system/purchase.js"></script>
  </body>
</html>
