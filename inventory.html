<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>Puregold| Dashboard</title>

    <link
      href="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/style.min.css"
      rel="stylesheet"
    />
    <link href="/css/styles.css" rel="stylesheet" />
    <link href="/css/dashboard.css" rel="stylesheet" />
    <script
      src="https://use.fontawesome.com/releases/v6.3.0/js/all.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <div id="layoutSidenav">
      <!-- Side Navigation -->
      <div class="dash_card side-nav-card">
        <nav class="sb-sidenav" id="sidenavAccordion">
          <div class="sidebar-header">
            <img
              src="assets/img/logo.png"
              height="100px"
              width="100px"
              alt=""
            />
            <div id="user_logged" class="user-info"></div>
          </div>
          <div class="sb-sidenav-menu">
            <a class="nav-link active" href="dashboard.html">
              <i class="fa-solid fa-table-columns" style="margin-right: 8px;"></i> Dashboard
            </a>
            <div id="nav_admin_pages"></div>
            <a class="nav-link" href="inventory.html">
              <i class="fa-solid fa-warehouse" style="margin-right: 8px;"></i> Inventory
            </a>
            <a class="nav-link" href="sales.html">
              <i class="fa-solid fa-clock-rotate-left" style="margin-right: 8px;"></i> Sales
            </a>
            <a class="nav-link" href="purchase.html">
              <i class="fa-solid fa-shop" style="margin-right: 8px;"></i> Purchase
            </a>
        
            <button id="btn_logout" class="logout">
              <i class="fa-solid fa-sign-out-alt" style="margin-right: 8px;"></i> Logout
            </button>
          </div>
        </nav>
      </div>

      <!-- Main Content -->
      <div id="layoutSidenav_content">
        <main>
          <div class="container-fluid px-4">
            <div class="row sticky-header">
              <div class="col-12 col-md-6">
                <h5 id="currentTimestamp" class="timestamp"></h5>
              </div>
            </div>
            <div class="row mt-5">
              <div class="col-md-12">
                <div class="card summary-card">
                  <div class="card-body">
                    <!-- Store Container -->
                    <div class="row mt-4" id="storeContainer">
                      <!-- Store cards will be dynamically generated here -->
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/js/system/inventory.js"></script>
  </body>
</html>
