<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>Puregold| Dashboard</title>

    <link
      href="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/style.min.css"
      rel="stylesheet"
    />
    <link href="css/styles.css" rel="stylesheet" />
    <link href="css/dashboard.css" rel="stylesheet" />
    <script
      src="https://use.fontawesome.com/releases/v6.3.0/js/all.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <div id="layoutSidenav">
      <!-- Side Navigation -->
      <div class="dash_card side-nav-card">
        <nav class="sb-sidenav" id="sidenavAccordion">
          <div class="sidebar-header">
            <img
              src="assets/img/logo.png"
              height="100px"
              width="100px"
              alt=""
            />
            <div id="user_logged" class="user-info"></div>
          </div>
          <div class="sb-sidenav-menu">
            <a class="nav-link active" href="dashboard.html">
              <i class="fa-solid fa-table-columns"></i> Dashboard
            </a>
            <div id="nav_admin_pages"></div>
            <a class="nav-link" href="inventory.html">
              <i class="fa-solid fa-warehouse"></i>Inventory
            </a>
            <a class="nav-link" href="supplies.html">
              <i class="fa-solid fa-clock-rotate-left"></i> Sales History
            </a>
            <a class="nav-link" href="purchase.html">
              <i class="fa-solid fa-shop"></i> Purchase
            </a>
            <a class="nav-link" href="customer.html">
              <i class="fa-solid fa-person"></i> Customer Point System
            </a>
            <button id="btn_logout" class="logout">
              <i class="fa-solid fa-sign-out-alt"></i> Logout
            </button>
          </div>
        </nav>
      </div>

      <!-- Main Content -->
      <div id="layoutSidenav_content">
        <main>
          <div class="container-fluid px-4">
            <div class="row sticky-header">
              <div class="col-12 col-md-6">
                <h5 id="currentTimestamp" class="timestamp"></h5>
              </div>
            </div>
            <div class="row mt-5">
              <div class="col-md-12">
                <div class="card summary-card">
                  <div class="card-body">
                    <div class="row">
                      <div class="col-12 col-md-6 text-center">
                        <a
                          href="#"
                          class="dash_btn"
                          data-bs-toggle="modal"
                          data-bs-target="#addStoreModal"
                          >Add Branch</a
                        >
                      </div>
                    </div>
                    <!-- Store Container -->
                    <div class="row mt-4" id="storeContainer">
                      <div class="col-12 col-md-6 col-lg-3 mb-4">
                        <div class="card">
                          <!-- Store card content -->
                        </div>
                      </div>
                      <div class="col-12 col-md-6 col-lg-3 mb-4">
                        <div class="card">
                          <!-- Store card content -->
                        </div>
                      </div>
                      <!-- Add more store cards as needed -->
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- Modal for Add Store -->
    <div
      class="modal fade"
      id="addStoreModal"
      tabindex="-1"
      aria-labelledby="addStoreModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="addStoreModalLabel">Branch</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <!-- Store Form -->
            <form id="addStoreForm">
              <div class="form-floating mb-3">
                <input
                  class="form-control"
                  id="store_name"
                  type="text"
                  name="store_name"
                  placeholder="Store Name"
                  required
                />
                <label for="store_name">Store Name</label>
                <div class="invalid-feedback">Please enter the store name.</div>
              </div>
              <div class="form-floating mb-3">
                <input
                  class="form-control"
                  id="store_address"
                  type="text"
                  name="store_address"
                  placeholder="Store Address"
                  required
                />
                <label for="store_address">Store Address</label>
                <div class="invalid-feedback">
                  Please enter the store address
                </div>
              </div>
              <div class="form-floating mb-3">
                <input
                  class="form-control"
                  id="operating_hours"
                  type="text"
                  name="operating_hours"
                  placeholder="Operating Hours"
                  required
                />
                <label for="operating_hours">Operating hours</label>
                <div class="invalid-feedback">
                  Please enter the operating hours
                </div>
              </div>
              <!-- Buttons aligned beside each other -->
              <div class="store-btn-container">
                <button
                  type="button"
                  class="store-btn close-btn"
                  data-bs-dismiss="modal"
                >
                  Close
                </button>
                <button type="submit" class="store-btn save-btn">
                  Save Store
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/js/system/dashboard.js"></script>
  </body>
</html>
