<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Puregold | Store</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/store.css" />
  </head>
  <body>
    <!-- Add these notification elements within the body or a relevant container -->
    <div
      id="successNotification"
      class="alert alert-success d-none"
      role="alert"
    ></div>
    <div
      id="errorNotification"
      class="alert alert-danger d-none"
      role="alert"
    ></div>
    <nav class="navbar navbar-expand-lg navbar-puregold">
      <div class="container-fluid">
        <a
          class="navbar-brand"
          href="dashboard.html"
          style="background-color: #fff"
        >
          <img
            src="assets/img/logo.png"
            class="m-2"
            height="50px"
            width="130px"
            alt="Puregold Logo"
          />
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNavDropdown"
          aria-controls="navbarNavDropdown"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNavDropdown">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="dashboard.html"
                >Home</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="products.html"
                >View Products</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="dashboard.html"
                >View Brands</a
              >
            </li>
          </ul>

          <!-- Search Form -->
          <form class="d-flex ms-auto mt-3" role="search">
            <input
              class="form-control me-2"
              type="search"
              placeholder="Search"
              aria-label="Search"
            />
            <button class="btn btn-outline" type="submit">Search</button>
          </form>
        </div>
      </div>
    </nav>
    <!-- Add Product Button -->
    <button
      class="btn btn-puregold ms-2 mt-3"
      data-bs-toggle="modal"
      data-bs-target="#addProductModal"
    >
      Add Product
    </button>
    <!-- Product Container to display products in cards -->
    <div class="container mt-4" id="productContainer">
      <!-- Dynamic product cards will be added here -->
    </div>

    <!-- Product Details Modal -->
    <div
      class="modal fade"
      id="productDetailsModal"
      tabindex="-1"
      aria-labelledby="productDetailsModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="productDetailsModalLabel">
              Product Details
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <p id="modalProductUPC"></p>
            <p id="modalProductName"></p>
            <p id="modalProductPrice"></p>
            <p id="modalProductQuantity"></p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn custom-modal-button"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button
              type="button"
              id="orderButton"
              class="btn custom-modal-button"
            >
              Order
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Order Form Modal -->
    <div
      class="modal fade"
      id="orderFormModal"
      tabindex="-1"
      aria-labelledby="orderFormModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="orderFormModalLabel">Order Form</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form id="orderForm">
              <div class="mb-3">
                <label for="quantity" class="form-label">Quantity</label>
                <input
                  type="number"
                  id="quantity"
                  name="quantity"
                  class="form-control"
                  min="1"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="customerId" class="form-label">Customer ID</label>
                <input
                  type="text"
                  id="customerId"
                  name="customer_id"
                  class="form-control"
                  required
                />
              </div>
              <!-- Product ID -->
              <div class="mb-3">
                <label for="productId" class="form-label">Product ID</label>
                <input
                  type="text"
                  id="productId"
                  name="product_id"
                  class="form-control"
                  readonly
                  required
                />
              </div>
              <div class="mb-3">
                <label for="storeId" class="form-label">Store ID</label>
                <input
                  type="text"
                  id="storeId"
                  name="store_id"
                  class="form-control"
                  required
                />
              </div>

              <!-- Submit Button moved inside the form -->
              <button
                type="submit"
                id="submitOrderButton"
                class="btn-puregold"
                style="height: 35px; border-radius: 10px; margin-left: 350px"
              >
                Submit Order
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Add Product Modal -->
    <div
      class="modal fade"
      id="addProductModal"
      tabindex="-1"
      aria-labelledby="addProductModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="addProductModalLabel">Add Product</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <!-- Product Form -->
            <form id="addProductForm" enctype="multipart/form-data">
              <div class="mb-3">
                <label for="UPC" class="form-label">UPC</label>
                <input
                  type="text"
                  class="form-control"
                  id="UPC"
                  name="UPC"
                  placeholder="Enter product UPC"
                />
              </div>
              <div class="mb-3">
                <label for="product_name" class="form-label"
                  >Product Name</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="product_name"
                  name="product_name"
                  placeholder="Enter product name"
                />
              </div>
              <div class="mb-3">
                <label for="size" class="form-label">Size</label>
                <input
                  type="text"
                  class="form-control"
                  id="size"
                  name="size"
                  placeholder="Enter product size"
                />
              </div>
              <div class="mb-3">
                <label for="packaging" class="form-label">Packaging</label>
                <input
                  type="text"
                  class="form-control"
                  id="packaging"
                  name="packaging"
                  placeholder="Enter product packaging"
                />
              </div>
              <!-- Product Type ID field removed -->
              <!-- Hidden field to pass product_type_id automatically -->
              <input
                type="hidden"
                id="product_type_id"
                name="product_type_id"
                value=""
              />
              <div class="mb-3">
                <label for="quantity" class="form-label">Quantity</label>
                <input
                  type="number"
                  class="form-control"
                  id="quantity"
                  name="quantity"
                  placeholder="Enter product quantity"
                />
              </div>
              <div class="mb-3">
                <label for="quantity" class="form-label">Price</label>
                <input
                  type="number"
                  class="form-control"
                  id="price"
                  name="price"
                  placeholder="Enter product price"
                />
              </div>
              <!-- <div class="mb-3">
                <label for="image" class="form-label">Product Image</label>
                <input type="file" class="form-control" id="image" />
              </div> -->
              <button type="submit" class="btn btn-puregold">
                Save Product
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module" src="/js/system/products.js"></script>
  </body>
</html>
