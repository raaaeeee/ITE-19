<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Puregold | Store</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/store.css" />
  </head>
  <body>
    <!-- Add these notification elements within the body or a relevant container -->
    <div
      id="successNotification"
      class="alert alert-success d-none"
      role="alert"
    ></div>
    <div
      id="errorNotification"
      class="alert alert-danger d-none"
      role="alert"
    ></div>
    <nav class="navbar navbar-expand-lg navbar-puregold">
      <div class="container-fluid">
        <a
          class="navbar-brand"
          href="dashboard.html"
          style="background-color: #dfe101"
        >
          <img
            src="assets/img/logo.png"
            class="m-2"
            height="50px"
            width="130px"
            alt="Puregold Logo"
          />
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNavDropdown"
          aria-controls="navbarNavDropdown"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNavDropdown">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="dashboard.html"
                >Home</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Inventory</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Sales</a>
            </li>
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle"
                href="#"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Grocery Items
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Beverages</a></li>
                <li><a class="dropdown-item" href="#">Food</a></li>
                <li><a class="dropdown-item" href="#">School Supplies</a></li>
              </ul>
            </li>
          </ul>

          <!-- Search Form -->
          <form class="d-flex ms-auto mt-3" role="search">
            <input
              class="form-control me-2"
              type="search"
              placeholder="Search"
              aria-label="Search"
            />
            <button class="btn btn-outline" type="submit">Search</button>
          </form>
        </div>
      </div>
    </nav>
    <!-- Add Parent Type Button -->
    <button
      class="btn btn-puregold ms-2 mt-3"
      data-bs-toggle="modal"
      data-bs-target="#addCategoryModal"
    >
      Add Category
    </button>
    <!-- Category Container to display products in cards -->
    <div class="container mt-4" id="parentContainer">
      <!-- Dynamic category cards will be added here -->
    </div>

    <!-- Add Category Modal -->
    <div
      class="modal fade"
      id="addCategoryModal"
      tabindex="-1"
      aria-labelledby="addCategoryModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="addCategoryModalLabel">Add Category</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <!-- Category Form -->
            <form id="addCategoryForm" enctype="multipart/form-data">
              <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input
                  type="text"
                  class="form-control"
                  id="name"
                  name="name"
                  placeholder="Enter category name"
                />
              </div>
              <button type="submit" class="btn btn-puregold">
                Save Category
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/system/parent_type.js"></script>
  </body>
</html>
