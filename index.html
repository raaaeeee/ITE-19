<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/custom.css" />
    <title>Puregold</title>
  </head>

  <body class="index">
    <div class="card-container">
      <!-- Card to hold the logo and buttons -->
      <div class="card">
        <!-- Logo -->
        <div class="logo">
          <img
            src="assets/img/logo.png"
            alt="Puregold Official Seal"
            class="seal"
          />
        </div>
        
        <!-- Buttons -->
        <div class="index_buttons">
          <button class="index_btn" onclick="admin()">ADMIN</button>
          <button class="index_btn" onclick="vendor()">VENDOR</button>
        </div>
      </div>
    </div>

    <script>
      function admin() {
        window.location.href = "login.html";
      }

      function vendor() {
        window.location.href = "vendor_login.html";
      }
    </script>
  </body>
</html>
