<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Puregold | Store</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/store.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <!-- Add these notification elements within the body or a relevant container -->
    <div
      id="successNotification"
      class="alert alert-success d-none"
      role="alert"
    ></div>
    <div
      id="errorNotification"
      class="alert alert-danger d-none"
      role="alert"
    ></div>
    <nav class="navbar navbar-expand-lg navbar-puregold">
      <div class="container-fluid">
        <a
          class="navbar-brand"
          href="dashboard.html"
          style="background-color: #fff"
        >
          <img
            src="assets/img/logo.png"
            class="m-2"
            height="50px"
            width="130px"
            alt="Puregold Logo"
          />
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNavDropdown"
          aria-controls="navbarNavDropdown"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNavDropdown">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="dashboard.html"
                >Home</a
              >
            </li>
          </ul>

          <!-- Search Form -->
          <form class="d-flex ms-auto mt-3" role="search">
            <input
              class="form-control me-2"
              type="search"
              placeholder="Search"
              aria-label="Search"
            />
            <button class="btn btn-outline" type="submit">Search</button>
          </form>
        </div>
      </div>
    </nav>

    <!-- Store Sales Chart Card -->
    <div class="container my-4">
      <div class="card">
        <div class="card-body">
          <canvas id="storeChart" width="400" height="200"></canvas>
        </div>
      </div>
    </div>

    <!-- Link the custom JS file -->
    <script type="module" src="/js/system/store_sales.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
