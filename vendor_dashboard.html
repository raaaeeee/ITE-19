<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>Puregold | Dashboard</title>

    <link
      href="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/style.min.css"
      rel="stylesheet"
    />
    <link href="css/styles.css" rel="stylesheet" />
    <link href="css/vendor.css" rel="stylesheet" />
    <script
      src="https://use.fontawesome.com/releases/v6.3.0/js/all.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <div id="layoutSidenav">
      <!-- Side Navigation -->
      <div class="dash_card side-nav-card">
        <nav class="sb-sidenav" id="sidenavAccordion">
          <div class="sidebar-header">
            <img
              src="assets/img/logo.png"
              height="100px"
              width="100px"
              alt=""
            />
            <div id="user_logged" class="user-info"></div>
          </div>
          
          <div class="sb-sidenav-menu">
            <a class="nav-link active" href="vendor_dashboard.html">
              <i class="fa-solid fa-table-columns" style="margin-right: 8px;"></i>  Dashboard
            </a>
            <div id="nav_admin_pages"></div>
            <!-- <a class="nav-link" href="vendor_sales.html">
              <i class="fa-solid fa-clock-rotate-left"></i> Sales
            </a> -->
            <button id="btn_logout" class="logout">
              <i class="fa-solid fa-sign-out-alt" style="margin-right: 8px;"></i> Logout
            </button>
          </div>
        </nav>
      </div>

      <!-- Add these notification elements within the body or a relevant container -->
      <div
        id="successNotification"
        class="alert alert-success d-none"
        role="alert"
      ></div>
      <div
        id="errorNotification"
        class="alert alert-danger d-none"
        role="alert"
      ></div>
      <!-- Main Content -->
      <div id="layoutSidenav_content">
        <main>
          <div class="container-fluid px-4">
            <div class="row sticky-header">
              <div class="col-12 col-md-6">
                <h5 id="currentTimestamp" class="timestamp"></h5>
              </div>
            </div>
            <div class="row mt-5">
              <div class="col-md-12">
                <div class="card summary-card">
                  <div class="card-body">
                    <!-- Table for displaying data -->
                    <div class="table-responsive">
                      <table class="table table-bordered">
                        <thead class="table-light">
                          <tr>
                            <th>Store Name</th>
                            <th>Store Address</th>
                            <th>Product</th>
                            <th>Quantity</th>
                            <th>Action</th>
                          </tr>
                        </thead>
                        <tbody id="storeProductTable">
                          <!-- Rows will be dynamically generated -->
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script type="module" src="/js/system/vendor.js"></script>
  </body>
</html>
